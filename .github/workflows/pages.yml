name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/configure-pages@v6
      - name: Stage site
        run: |
          mkdir _site
          cp index.html palettes.html voron24.glb _site/
          # Fail loudly if LFS left a pointer file instead of the real model
          if head -c 100 _site/voron24.glb | grep -q 'git-lfs'; then
            echo "voron24.glb is an LFS pointer, not the model"; exit 1
          fi
          # Version the model URL with its content hash so browsers never reuse a stale copy
          version=$(sha256sum _site/voron24.glb | cut -c1-12)
          sed -i "s/__MODEL_VERSION__/$version/" _site/index.html
          grep -q "voron24.glb?v=$version" _site/index.html
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
